# Builds the codespace image and publishes it to ghcr.io/onedimkurt/bioinfo-workshop
# (WORKSHOP.md §7 Phase 1). Runs only in the organiser's repository: every trainee's
# copy inherits this file, and the "if" below keeps their copies from building.
# Every run writes its logs to the branch "ci-status" (status/), so the build chat can
# read them with git; "Use this template" copies only main, never that branch.
name: image

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'onedimkurt/bioinfo-workshop'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      IMAGE: ghcr.io/onedimkurt/bioinfo-workshop
    steps:
      - name: Free disk space on the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Prepare log folder
        run: |
          mkdir -p ci
          echo "date=$(TZ=Europe/Istanbul date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Shell scripts pass shellcheck (errors only)
        id: lint
        run: |
          set -o pipefail
          shellcheck --version | tee ci/lint.log
          shellcheck -S error -s bash .devcontainer/build/scripts/*.sh .devcontainer/build/bash.bashrc.append \
            check/*.sh 2>&1 | tee -a ci/lint.log

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        id: build
        run: |
          set -o pipefail
          start=$(date +%s)
          docker buildx build --progress=plain --load \
            --cache-from "type=registry,ref=$IMAGE:buildcache" \
            --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
            -t "$IMAGE:candidate" -f .devcontainer/Dockerfile . 2>&1 | tee ci/build.log
          echo "build seconds: $(( $(date +%s) - start ))" | tee -a ci/build.log

      - name: Smoke test inside the image (as rstudio)
        id: smoke
        run: |
          set -o pipefail
          docker image inspect "$IMAGE:candidate" --format '{{.Size}}' \
            | awk '{printf "uncompressed image size: %.2f GB\n", $1/1e9}' | tee ci/smoke.log
          docker run --rm -u rstudio "$IMAGE:candidate" \
            /usr/local/share/bioinfo-workshop/smoke-test.sh 2>&1 | tee -a ci/smoke.log

      - name: Push latest and the dated tag
        id: push
        run: |
          set -o pipefail
          docker tag "$IMAGE:candidate" "$IMAGE:latest"
          docker tag "$IMAGE:candidate" "$IMAGE:$date"
          { docker push "$IMAGE:$date" && docker push "$IMAGE:latest"; } 2>&1 | tail -n 20 | tee ci/push.log

      - name: Write status to the ci-status branch
        if: always()
        run: |
          {
            echo "run: ${{ github.run_id }}  attempt: ${{ github.run_attempt }}"
            echo "commit: ${{ github.sha }}"
            echo "tag: $IMAGE:$date"
            echo "lint: ${{ steps.lint.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "smoke: ${{ steps.smoke.outcome }}"
            echo "push: ${{ steps.push.outcome }}"
          } > ci/STATUS
          grep -nE '(^|[^a-z])(ERROR|Error|error:|FAILED|failed)' ci/build.log 2>/dev/null | tail -n 80 > ci/build-errors.log || true
          tail -n 300 ci/build.log > ci/build-tail.log 2>/dev/null || true
          sed -n '/==== installed versions ====/,/^#[0-9]* DONE/p' ci/build.log > ci/r-versions.log 2>/dev/null || true
          { echo '## image run'; echo; echo '```'; cat ci/STATUS; echo '```'; echo; echo '```'; cat ci/smoke.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/status-new
          cp ci/STATUS /tmp/status-new/
          for f in ci/*.log; do [ "$f" = ci/build.log ] || cp "$f" /tmp/status-new/; done
          for attempt in 1 2 3; do
            if git fetch -q origin ci-status; then
              git checkout -q -f -B ci-status FETCH_HEAD
            else
              git checkout -q -f --orphan ci-status && { git rm -rq --cached . >/dev/null 2>&1 || true; }
            fi
            rm -rf status/image && mkdir -p status/image && cp /tmp/status-new/* status/image/
            git add status/image
            git commit -qm "image run ${{ github.run_id }}: build ${{ steps.build.outcome }}, smoke ${{ steps.smoke.outcome }}" || true
            git push -q origin HEAD:refs/heads/ci-status && break
            sleep 5
          done

      - name: Keep the full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-logs-${{ github.run_id }}
          path: ci/
          retention-days: 14
