# /etc/bioinfo-workshop/nginx.conf -- small proxy in front of RStudio, run as rstudio.
# Why: Codespaces forwards port 8787 with "Host: localhost:8787"; RStudio then answers
# its sign-in step with an absolute redirect to http://localhost:8787/, which the
# trainee's browser cannot reach (seen 2026-10-01). This proxy turns every redirect
# into a relative one, so the browser stays on the ...-8787.app.github.dev address.
worker_processes 1;
pid /tmp/bioinfo-workshop-nginx/nginx.pid;
error_log /tmp/bioinfo-workshop-nginx/error.log warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/bioinfo-workshop-nginx/body;
    proxy_temp_path       /tmp/bioinfo-workshop-nginx/proxy;
    fastcgi_temp_path     /tmp/bioinfo-workshop-nginx/fastcgi;
    uwsgi_temp_path       /tmp/bioinfo-workshop-nginx/uwsgi;
    scgi_temp_path        /tmp/bioinfo-workshop-nginx/scgi;
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    map $http_x_forwarded_host $rstudio_host {
        default $http_x_forwarded_host;
        ''      $http_host;
    }

    server {
        listen 8787;
        # Without this nginx turns the relative Location below back into
        # http://<Host>:<port>/..., i.e. http://localhost:8787/ again (found 2026-10-01).
        absolute_redirect off;
        location / {
            proxy_pass http://127.0.0.1:8788;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $rstudio_host;
            proxy_redirect ~^https?://[^/]+(/.*)$ $1;
            proxy_read_timeout 20d;
            proxy_buffering off;
        }
    }
}
